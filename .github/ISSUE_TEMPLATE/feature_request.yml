name: Feature request
description: Suggest a focused reader or platform improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Affected platforms
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Include expected behavior, scope and data-compatibility implications.
    validations:
      required: true
