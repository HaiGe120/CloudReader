name: CloudReader desktop

on:
  # Retained as a manual diagnostic. apps.yml owns coordinated delivery.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-jvm:
    name: Desktop JVM checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            runner: windows-2022
            container: ''
          - os: debian-12
            runner: ubuntu-24.04
            container: debian:12-slim
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      # The hosted runner supplies Docker; all Linux checks run inside Debian 12.
      - name: Install Debian build prerequisites
        if: matrix.os == 'debian-12'
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils ca-certificates curl fakeroot fontconfig git libasound2 \
            libfreetype6 libstdc++6 libx11-6 libxext6 libxi6 libxrender1 libxtst6 unzip

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run Kotlin core tests
        shell: bash
        run: ./Packages/CloudReaderKotlin/gradlew -p Packages/CloudReaderKotlin test

      - name: Run desktop unit checks
        shell: bash
        run: ./Packages/CloudReaderKotlin/gradlew -p Apps/Desktop test

      - name: Build desktop distribution
        shell: bash
        run: ./Packages/CloudReaderKotlin/gradlew -p Apps/Desktop packageDistributionForCurrentOS

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudreader-desktop-${{ matrix.os }}
          path: |
            Apps/Desktop/build/compose/binaries/**
            Apps/Desktop/build/distributions/**

  contract-fixtures:
    name: Shared contract fixture checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run Kotlin contract tests
        shell: bash
        run: ./Packages/CloudReaderKotlin/gradlew -p Packages/CloudReaderKotlin test --tests '*Contract*' --tests '*Merge*'
