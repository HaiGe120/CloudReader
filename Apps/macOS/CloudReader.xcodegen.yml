name: CloudReader
options:
  bundleIdPrefix: io.github.haige120
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: io.github.haige120.cloudreader.macos
    CLOUDREADER_APP_BUNDLE_IDENTIFIER: io.github.haige120.cloudreader.macos
    PRODUCT_NAME: CloudReader
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: W6DM8CHQA7
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: CloudReader
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Tianhai Zhu"
    CODE_SIGN_ENTITLEMENTS: CloudReader/CloudReader.entitlements
    ENABLE_APP_SANDBOX: YES
targets:
  CloudReader:
    type: application
    platform: macOS
    info:
      path: CloudReader/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: io.github.haige120.cloudreader
            CFBundleURLSchemes:
              - io.github.haige120.cloudreader
              - cloudreader
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: PDF book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Text book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
          - CFBundleTypeName: Other book formats
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - io.github.haige120.cloudreader.mobi
              - io.github.haige120.cloudreader.azw3
              - io.github.haige120.cloudreader.fb2
              - io.github.haige120.cloudreader.cbz
              - io.github.haige120.cloudreader.cbr
        UTImportedTypeDeclarations: &bookTypeDeclarations
          - UTTypeIdentifier: io.github.haige120.cloudreader.mobi
            UTTypeDescription: Mobipocket book
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [mobi]
              public.mime-type: [application/x-mobipocket-ebook]
          - UTTypeIdentifier: io.github.haige120.cloudreader.azw3
            UTTypeDescription: Kindle book
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [azw3]
              public.mime-type: [application/vnd.amazon.mobi8-ebook]
          - UTTypeIdentifier: io.github.haige120.cloudreader.fb2
            UTTypeDescription: FictionBook book
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [fb2]
              public.mime-type: [application/x-fictionbook+xml]
          - UTTypeIdentifier: io.github.haige120.cloudreader.cbz
            UTTypeDescription: Comic ZIP book
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
              public.mime-type: [application/vnd.comicbook+zip]
          - UTTypeIdentifier: io.github.haige120.cloudreader.cbr
            UTTypeDescription: Comic RAR book
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
              public.mime-type: [application/vnd.comicbook-rar]
    sources:
      - path: CloudReader
        excludes:
          - "Info [0-9]*.plist"
      - path: ../Shared
        excludes:
          - AppleSyncPipeline 2.swift
          - BookImportCoordinator 2.swift
          - KindleDecoder
      - path: ../Shared/KindleDecoder
        buildPhase: resources
    resources:
      - path: CloudReader/Resources/CloudReader_Field_Guide.txt
      - path: ../Shared/PrivacyInfo.xcprivacy
    dependencies:
      - target: CloudReaderShare
      - package: CloudReaderKit
        product: CloudReaderCore
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: Unrar
        product: Unrar
      - package: Citadel
        product: Citadel
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIO
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOUDREADER_APP_BUNDLE_IDENTIFIER)
        SWIFT_EMIT_LOC_STRINGS: YES
  CloudReaderShare:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes:
          - "Info [0-9]*.plist"
      - path: ../Shared/Sharing
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: CloudReader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UTImportedTypeDeclarations: *bookTypeDeclarations
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.idpf.epub-container" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "io.github.haige120.cloudreader.mobi" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "io.github.haige120.cloudreader.azw3" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "io.github.haige120.cloudreader.fb2" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "io.github.haige120.cloudreader.cbz" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "io.github.haige120.cloudreader.cbr"
              ).@count > 0).@count > 0
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - W6DM8CHQA7.io.github.haige120.cloudreader.macos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOUDREADER_APP_BUNDLE_IDENTIFIER).share
        PRODUCT_NAME: CloudReaderShare
        INFOPLIST_KEY_CFBundleDisplayName: CloudReader
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  CloudReaderMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CloudReaderTests
      - path: ../iOS/CloudReaderTests/CBZPublicationTests.swift
      - path: ../iOS/CloudReaderTests/CBRPublicationTests.swift
      - path: ../iOS/CloudReaderTests/KindlePublicationTests.swift
      - path: ../iOS/CloudReaderTests/FB2PublicationTests.swift
      - path: ../iOS/CloudReaderTests/AppleSyncPipelineTests.swift
      - path: ../iOS/CloudReaderTests/SharedBookInboxTests.swift
      - path: ../iOS/CloudReaderTests/BookCoverThumbnailTests.swift
      - path: ../iOS/CloudReaderTests/ReaderContractTests.swift
      - path: ../iOS/CloudReaderTests/CBRFixtures
        buildPhase: resources
        excludes:
          - NOTICE.txt
      - path: ../iOS/CloudReaderTests/KindleFixtures
        buildPhase: resources
        excludes:
          - NOTICE.txt
          - '*.go'
          - go.mod
          - go.sum
    dependencies:
      - target: CloudReader
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: CloudReaderKit
        product: CloudReaderCore
    settings:
      base:
        PRODUCT_NAME: CloudReaderMacTests
        PRODUCT_MODULE_NAME: CloudReaderMacTests
        PRODUCT_BUNDLE_IDENTIFIER: io.github.haige120.cloudreader.macos.tests
        GENERATE_INFOPLIST_FILE: YES
  CloudReaderMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: CloudReaderUITests
      - path: ../iOS/CloudReaderTests/KindleFixtures/reflowable-combo.mobi
        buildPhase: resources
      - path: ../iOS/CloudReaderTests/KindleFixtures/rich-kf8-image-links.azw3
        buildPhase: resources
      - path: ../iOS/CloudReaderTests/CBRFixtures/rar5-solid-pages.rar
        buildPhase: resources
    dependencies:
      - target: CloudReader
    settings:
      base:
        PRODUCT_NAME: CloudReaderMacUITests
        PRODUCT_MODULE_NAME: CloudReaderMacUITests
        PRODUCT_BUNDLE_IDENTIFIER: io.github.haige120.cloudreader.macos.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CloudReader
schemes:
  CloudReader:
    build:
      targets:
        CloudReader: all
    run:
      config: Debug
    test:
      targets:
        - CloudReaderMacTests
        - CloudReaderMacUITests
      environmentVariables:
        CLOUDREADER_TEST_HOST: "1"
packages:
  Unrar:
    url: https://github.com/mtgto/Unrar.swift.git
    revision: 7216007a38ac122dbdeae26cfdaf7f10775c868f
  CloudReaderKit:
    path: ../../Packages/CloudReaderKit
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.1
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
